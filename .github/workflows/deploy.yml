name: Deploy mdBook with Encryption

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      password:
        description: 'Encryption password (leave empty to use secret)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build mdBook
        run: mdbook build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Encrypt content
        env:
          ENCRYPT_PASSWORD: ${{ github.event.inputs.password || secrets.MDBOOK_PASSWORD }}
        run: |
          if [ -n "$ENCRYPT_PASSWORD" ]; then
            node scripts/encrypt.js "$ENCRYPT_PASSWORD" ./book
            echo "Content encrypted with password"
          else
            echo "No password set, skipping encryption"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
