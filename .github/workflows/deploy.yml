name: Deploy mdBook

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.51'

      - name: Setup mdbook-admonish
        run: |
          mkdir -p /tmp/mdbook-admonish
          curl -sL https://github.com/tommilligan/mdbook-admonish/releases/download/v1.20.0/mdbook-admonish-v1.20.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /tmp/mdbook-admonish
          sudo install /tmp/mdbook-admonish/mdbook-admonish /usr/local/bin/

      - name: Setup mdbook-pagetoc
        run: |
          mkdir -p /tmp/mdbook-pagetoc
          curl -sL https://github.com/slowsage/mdbook-pagetoc/releases/download/v0.2.2/mdbook-pagetoc-v0.2.2-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /tmp/mdbook-pagetoc
          sudo install /tmp/mdbook-pagetoc/mdbook-pagetoc /usr/local/bin/

      - name: Build mdBook
        run: mdbook build

      - name: Add robots.txt
        run: |
          cat > ./book/robots.txt << 'EOF'
          User-agent: *
          Disallow: /
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
