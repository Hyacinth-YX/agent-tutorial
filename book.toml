[book]
title = "AI Agent 教程"
authors = ["yaoxu"]
language = "zh-CN"
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
mathjax-support = false
copy-fonts = true
additional-css = ["theme/custom.css"]
no-section-label = false
git-repository-url = "https://github.com/Hyacinth-YX/agent-tutorial"
git-repository-icon = "fa-github"

[output.html.print]
enable = true

[output.html.fold]
enable = true
level = 1
